name: DevSecOps Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  # Job 1: Static Application Security Testing (SAST)
  sast:
    name: "SAST - Semgrep Code Scan"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4

      - name: "Run Semgrep scan"
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/nodejs
            p/owasp-top-ten
            .semgrep/juice-shop-rules.yml
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: "Upload SARIF results"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # Job 2: Secret Detection
  secrets-scan:
    name: "Secrets Scan - Gitleaks"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository with full history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Install Gitleaks"
        run: |
          wget -qO gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: "Run Gitleaks scan"
        run: |
          ./gitleaks detect --source . --redact -v

  # Job 3: Software Composition Analysis (SCA)
  sca:
    name: "SCA - Dependency Vulnerability Scan"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: "Install dependencies"
        run: npm install

      - name: "Run npm audit"
        run: |
          echo "=== NPM AUDIT RESULTS ==="
          npm audit --audit-level=high --json > npm-audit-results.json || true
          npm audit --audit-level=high || true

      - name: "Run Trivy dependency scan"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-sca.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: "Upload SARIF results"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-sca.sarif'
        continue-on-error: true

      - name: "Generate SBOM"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'cyclonedx'
          output: 'sbom.json'

      - name: "Upload SBOM artifact"
        uses: actions/upload-artifact@v4
        with:
          name: sbom-report
          path: sbom.json

  # Job 4: Container Security Scan
  container-scan:
    name: "Container - Docker Image Scan"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4

      - name: "Build hardened Docker image"
        run: |
          docker build -f Dockerfile.hardened -t juice-shop:${{ github.sha }} .

      - name: "Run Trivy image scan"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'juice-shop:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: "Upload SARIF results"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image.sarif'
        continue-on-error: true

      - name: "Run container smoke test"
        run: |
          docker run -d --name juice-test -p 3000:3000 juice-shop:${{ github.sha }}
          sleep 15
          curl -f http://localhost:3000 || (echo "Application failed to start" && exit 1)
          docker stop juice-test

  # Job 5: Pipeline Summary
  pipeline-summary:
    name: "Pipeline Summary"
    runs-on: ubuntu-latest
    needs: [sast, secrets-scan, sca, container-scan]
    if: always()

    steps:
      - name: "Check final pipeline status"
        run: |
          echo "================================"
          echo "DEVSECOPS PIPELINE SUMMARY"
          echo "================================"
          echo "SAST Result:           ${{ needs.sast.result }}"
          echo "Secrets Scan Result:   ${{ needs.secrets-scan.result }}"
          echo "SCA Result:            ${{ needs.sca.result }}"
          echo "Container Scan Result: ${{ needs.container-scan.result }}"
          echo "================================"

          if [[ "${{ needs.sast.result }}" == "failure" || \
                "${{ needs.secrets-scan.result }}" == "failure" || \
                "${{ needs.sca.result }}" == "failure" || \
                "${{ needs.container-scan.result }}" == "failure" ]]; then
            echo "PIPELINE FAILED - Security issues detected"
            exit 1
          else
            echo "ALL SECURITY CHECKS PASSED"
          fi
