title = "Gitleaks Config"

# Custom rules without entropy thresholds - for demo/training purposes
[[rules]]
id = "demo-github-pat"
description = "Hardcoded GitHub Personal Access Token"
regex = '''ghp_[0-9a-zA-Z]{36}'''
tags = ["github", "token"]

[[rules]]
id = "demo-aws-access-key"
description = "Hardcoded AWS Access Key ID"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["aws", "key"]

[[rules]]
id = "demo-aws-secret-key"
description = "Hardcoded AWS Secret Access Key"
regex = '''(?i)aws.{0,20}secret.{0,20}=\s*["'"'"'][0-9a-zA-Z/+=]{40}["'"'"']'''
tags = ["aws", "secret"]
